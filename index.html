      ${selfHandledOption(t)}</fieldset>${state.picks[t.id]?`<button type="button" class="clear" id="clr-${t.id}" data-clear="${t.id}">Clear my choice</button>`:''}</div>`) : '';
    return `
    <li class="task ${isDone?"done":""} ${t.id===nextId?"next":""} ${t.id==="moveday"?"moveday":""}">
      <div class="when"><div class="d">${fmtDate(due)}</div><div class="r ${rel.late?"late":""}">${rel.t}</div></div>
      <div class="dot" aria-hidden="true"></div>
      <div class="body"><div class="card">
        <div class="row">
          <input type="checkbox" class="check" id="c-${t.id}" data-done="${c.booked ? "" : t.id}" ${isDone?"checked":""} ${c.booked?"disabled":""} aria-label="Mark “${esc(t.title)}” done">
          <div class="main">
            ${t.providers
              ? `<div class="main-text" data-toggle="${t.id}" role="button" tabindex="0" aria-expanded="${open}" aria-controls="sl-${t.id}"><div class="title">${esc(t.title)}</div><div class="sub">${sub}</div></div>`
              : `<div class="main-text"><div class="title">${esc(t.title)}</div><div class="sub">${sub}</div></div>`}
            ${c.booked ? `<div class="bk-actions"><button type="button" class="toggle" id="chg-${t.id}" data-toggle="${t.id}" aria-expanded="${open&&state.compareTask!==t.id}" aria-controls="sl-${t.id}">${open&&state.compareTask!==t.id ? "Hide details" : "Request details"}</button><button type="button" class="toggle" data-compare-providers="${t.id}" aria-expanded="${open&&state.compareTask===t.id}" aria-controls="sl-${t.id}">${open&&state.compareTask===t.id?"Hide options":"Compare other providers"}</button>${['requested','accepted'].includes(bookingStatus(c.booked))?`<button type="button" class="toggle danger" id="cxl-${t.id}" data-cancel="${t.id}">Cancel request</button>`:['declined','legacy'].includes(bookingStatus(c.booked))?`<button type="button" class="toggle ${bookingStatus(c.booked)==='legacy'?'remove-saved-request':''}" data-request-retry="${t.id}">${bookingStatus(c.booked)==='declined'?'Choose another provider':'Remove saved request'}</button>`:''}</div>` : ""}
            ${t.custom ? `<button type="button" class="toggle danger" data-remove="${t.id}">Remove task</button>` : ""}
            ${t.providers && !c.booked ? `<button type="button" class="toggle" id="t-${t.id}" data-toggle="${t.id}" aria-expanded="${open}" aria-controls="sl-${t.id}">${open ? "Hide options" : c.diy ? "Change choice" : c.pick ? "Change provider" : "Compare options"}</button>` : ""}
          </div>
          <div class="est">${est}</div>
        </div>${shortlist}
      </div></div>
    </li>`;
  }).join("");

  const moveLabel = days > 1 ? `<div class="v">${days} <small>days</small></div>` : days === 1 ? `<div class="v">1 <small>day</small></div>` : days === 0 ? `<div class="v">Today</div>` : `<div class="v">${-days} <small>days ago</small></div>`;

  document.getElementById("app").innerHTML = `
  <header class="topbar"><div class="wrap">
    <button type="button" class="mark" data-home aria-label="Move Me home"><i aria-hidden="true"></i>Move Me</button>
    <div class="top-actions"><span class="hello">Hi, ${esc(state.user.name.split(" ")[0])}</span><button class="btn btn-ghost" id="account">My account</button><button class="btn btn-ghost" id="edit">Edit move</button><button class="btn btn-ghost" data-signout>Sign out</button></div>
  </div></header>
  <section class="hero"><div class="wrap">
    <p class="dashboard-eyebrow">Your move overview</p><h1 class="route"><span>${esc(m.from)}</span><span class="arrow" aria-label="to">→</span><span class="to">${esc(m.to)}</span></h1>
    <div class="route-meta">${fmtLong(move)} · ${SIZES[m.size][0]} · ${accessText(m)}</div>
    <div class="stats">
      <div class="stat"><div class="k">Until move day</div>${moveLabel}</div>
      <div class="stat budget">
        <div class="k">Estimated move budget</div>
        <div class="v">${money(total)} <small>for your whole move</small></div>
        <div class="meter" role="img" aria-label="${money(spent)} from chosen providers and ${money(projected)} still estimated, of a ${money(total)} total estimate">
          <div class="spent" style="width:${(spent/scaleMax*100).toFixed(2)}%"></div>
          <div class="proj" style="width:${(projected/scaleMax*100).toFixed(2)}%"></div>
        </div>
        <div class="legend">
          <span><span class="sw" style="background:var(--coral)"></span><b>${money(spent)}</b> selected services</span>
          <span><span class="sw" style="background:rgba(249,97,103,.45)"></span><b>${money(projected)}</b> remaining estimate</span>
        </div>
        <p class="price-note">Final prices are agreed with your providers.</p>
      </div>
      <div class="stat"><div class="k">Tasks done</div><div class="v">${doneCount} <small>of ${AT.length}</small></div></div>
    </div>
  </div></section>
  <main class="plan ${bookable().some(t=>!state.bookings[t.id]&&state.picks[t.id]&&state.picks[t.id]!=="diy"&&t.providers.some(p=>p.id===state.picks[t.id]&&!p.archived))?"has-request-bar":""}"><div class="wrap">
    ${compactPlanHeader(move)}
    <ol class="timeline">${items}</ol>
    <details class="addtask-disclosure"><summary>Add a task</summary><form class="addtask" id="addtask" novalidate><h3>Add your own task</h3><p class="hint">This is just for you to track; Move Me won't book anything for it.</p><div class="addrow"><input id="ctitle" placeholder="e.g. Ship the car" aria-label="Task name"><input id="cdate" type="date" aria-label="Due date"><details class="form-details"><summary>More details</summary><label for="ccost">Estimated cost (optional)</label><input id="ccost" type="number" min="0" step="10" placeholder="Cost (optional)" aria-label="Cost in dollars"></details><button class="btn btn-navy" type="submit">Add</button></div><span class="err" id="cerr" role="alert"></span></form></details>
    <p class="foot">Estimates help you plan your budget. Final pricing is agreed with your provider. <button id="reset">Start a new plan</button></p>
  </div></main>${requestActionBar()}`;
}

document.addEventListener("submit", e=>{
  if(e.target.id !== "addtask") return;
  e.preventDefault();
  const t = document.getElementById("ctitle").value.trim(), d = document.getElementById("cdate").value, costEl = document.getElementById("ccost");
  const cost = Math.max(0, Math.round(Number(costEl.value) || 0));
  const err = document.getElementById("cerr");
  if(!t || !d){ err.textContent = "Add a task name and a due date."; return; }
  err.textContent = "";
  state.custom.push({id:"c"+Date.now(), title:t, date:d, cost});
  rerender();
}, true);
function rerender(){
  const id = document.activeElement && document.activeElement.id;
  save(); renderPlan();
  if(id){ const el = document.getElementById(id); if(el) el.focus({preventScroll:true}); }

}

function closeConfirm(){
  const root = document.getElementById("modal-root");
  root.innerHTML = "";
  document.removeEventListener("keydown", onConfirmKey, true);
  if(window.__lastFocus){ window.__lastFocus.focus({preventScroll:true}); window.__lastFocus = null; }
}
function onConfirmKey(e){
  if(e.key === "Escape"){ e.preventDefault(); closeConfirm(); return; }
  if(e.key === "Tab"){
    const box = document.querySelector(".confirm-box"); if(!box) return;
    const items = [...box.querySelectorAll("button:not([disabled]),textarea,input,select")]; if(!items.length) return;
    const first = items[0], last = items[items.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
}
function showConfirm({title, body, confirmLabel, cancelLabel, danger, onConfirm}){
  window.__lastFocus = document.activeElement;
  const root = document.getElementById("modal-root");
  root.innerHTML = `
  <div class="confirm-backdrop" data-confirm-backdrop>
    <div class="confirm-box" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <h2 id="confirm-title">${esc(title)}</h2>
      <p id="confirm-body">${esc(body)}</p>
      <div class="confirm-actions">
        <button type="button" class="btn btn-line" data-confirm-cancel>${esc(cancelLabel || "Never mind")}</button>
        <button type="button" class="btn ${danger ? "btn-danger" : "btn-coral"}" data-confirm-ok>${esc(confirmLabel || "Confirm")}</button>
      </div>
    </div>
  </div>`;
  document.addEventListener("keydown", onConfirmKey, true);
  root.querySelector("[data-confirm-backdrop]").addEventListener("click", e=>{ if(e.target.dataset.confirmBackdrop !== undefined && e.target === e.currentTarget) closeConfirm(); });
  root.querySelector("[data-confirm-cancel]").addEventListener("click", closeConfirm);
  root.querySelector("[data-confirm-ok]").addEventListener("click", ()=>{ closeConfirm(); onConfirm(); });
  root.querySelector("[data-confirm-ok]").focus();
}
document.addEventListener("keydown", e=>{
  if((e.key === "Enter" || e.key === " ") && e.target.closest("[data-toggle]") && e.target.getAttribute("role") === "button"){
    e.preventDefault(); const t = e.target.closest("[data-toggle]");
    state.open = state.open === t.dataset.toggle && (t.classList.contains('main-text') || state.compareTask!==t.dataset.toggle) ? null : t.dataset.toggle; state.compareTask=null; rerender();
  }
});
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-toggle]");
  if(t){ state.open = state.open === t.dataset.toggle && (t.classList.contains('main-text') || state.compareTask!==t.dataset.toggle) ? null : t.dataset.toggle; state.compareTask=null; rerender(); return; }
  if(e.target.closest("[data-start]")){ !state.signedIn ? renderRegister() : state.move ? renderPlan() : renderSetup(); window.scrollTo(0,0); return; }
  const fg = e.target.closest("[data-forgot]");
  if(fg){ renderForgot(fg.dataset.forgot); window.scrollTo(0,0); return; }
  if(e.target.closest("[data-provhome]")){ renderProviderHome(); window.scrollTo(0,0); return; }
  const lg = e.target.closest("[data-login]");
  if(lg){ renderSignIn(lg.dataset.login); window.scrollTo(0,0); return; }
  if(e.target.closest("[data-newcust]")){ signOutAll().then(()=>{ renderRegister(); window.scrollTo(0,0); }); return; }
  if(e.target.closest("[data-provsignup]")){ renderProviderSignup(); window.scrollTo(0,0); return; }
  if(e.target.closest("[data-signout]") || e.target.closest("[data-provsignout]")){ signOutAll().then(()=>{ renderLanding(); window.scrollTo(0,0); }); return; }
  if(e.target.closest("[data-home]")){ renderLanding(); window.scrollTo(0,0); return; }
  const rmv = e.target.closest("[data-remove]");
  if(rmv){ const id = rmv.dataset.remove; state.custom = state.custom.filter(c=>c.id!==id); delete state.done[id]; rerender(); return; }
  const cx = e.target.closest("[data-cancel]");
  if(cx){ const tid = cx.dataset.cancel, t = TASKS.find(x=>x.id===tid), b = state.bookings[tid], p = t.providers.find(x=>x.id===b.provider);
    showConfirm({
      title: "Cancel this request?",
      body: `Cancel your request with ${p.name} (${b.conf})? The task goes back on your plan with no provider chosen.`,
      confirmLabel: "Cancel request",
      danger: true,
      onConfirm(){ cancelCustomerRequest(tid); }
    });
    return; }
  const cl = e.target.closest("[data-clear]");
  if(cl){ const id = cl.dataset.clear; delete state.picks[id]; rerender(); const tg=document.getElementById("t-"+id); if(tg) tg.focus({preventScroll:true}); return; }
  const id = e.target.id;
  if(id === "review"){ state.draft = {}; renderReview(); window.scrollTo(0,0); return; }
  if(id === "viewbk"){ renderConfirmation(null); window.scrollTo(0,0); return; }
  if(id === "toplan3"){ if(document.querySelector("[data-draft]")) { syncDraft(); save(); } renderPlan(); window.scrollTo(0,0); return; }
  if(id === "confirm"){ confirmBookings(); return; }
  if(id === "editacct"){ syncDraft(); save(); state.returnTo = "review"; renderRegister(); window.scrollTo(0,0); return; }
  if(e.target.id === "account"){ state.returnTo = null; renderRegister(); window.scrollTo(0,0); document.getElementById("name").focus(); return; }
  if(e.target.id === "edit"){ renderSetup(); window.scrollTo(0,0); document.getElementById("from").focus(); return; }
  if(e.target.id === "reset"){
    showConfirm({
      title: "Start a new plan?",
      body: "This cancels your pending and confirmed requests and clears your current plan. Past requests stay in your history. Your account stays.",
      confirmLabel: "Start over",
      danger: true,
      async onConfirm(){const uid=state.uid,generation=requestGeneration;try{if(state.requestPlanId){if(!sb?.rpc)throw Error(DB_DOWN);const {error}=await sb.rpc('moveme_cancel_plan_requests',{p_plan_id:state.requestPlanId});if(error)throw error;}if(uid!==state.uid||generation!==requestGeneration)return;state={...state,...freshPlan()};customerRequestsLoaded=false;save();renderSetup();window.scrollTo(0,0);}catch(error){if(uid===state.uid)toast(requestError(error));}}
    });
  }
});
document.addEventListener("change", e=>{
  const el = e.target;
  if(el.dataset.todo){ state.done[el.dataset.todo] = true; save(); renderConfirmation(); const n=document.querySelector("[data-todo]"); (n||document.getElementById("toplan3")).focus({preventScroll:true}); return; }
  if(el.dataset.done){ state.done[el.dataset.done] = el.checked; rerender(); }
  else if(el.dataset.compareChoice){state.comparisonPicks=state.comparisonPicks||{};state.comparisonPicks[el.dataset.compareChoice]=el.value;renderPlan();const radio=document.getElementById(el.id);if(radio)radio.focus({preventScroll:true});}
  else if(el.dataset.task){if(state.picks[el.dataset.task]!==el.value)state.done[el.dataset.task]=false;state.picks[el.dataset.task] = el.value; rerender(); }
});

/* ---------- Back navigation ----------
   Each screen change adds a browser history entry, so the browser's back arrow
   (and swipe-back on phones) moves between Move Me screens instead of leaving
   the site. A Back button in each header does the same thing. */
let navPopping = false, navDepth = 0, curScreen = null;
function navArgs(name, args){
  if(name === "signin" || name === "forgot") return [args[0]];
  if(name === "checkemail") return [args[0], args[1]];
  return []; // other screens rebuild from the current state
}
// Preserve the initial composition when details or validation messages grow a form.
function anchorSetupForms(){
  const grid = document.querySelector('#app .setup-main');
  if(!grid) return;
  grid.style.alignItems = '';
  const children = [...grid.children];
  children.forEach(child => child.style.marginTop = '');
  if(window.matchMedia('(max-width: 820px)').matches) return;
  // Measure the compact move form, including when saved access details start open.
  const disclosures = [...grid.querySelectorAll('#setup details[open]')];
  disclosures.forEach(details => details.open = false);
  const top = grid.getBoundingClientRect().top;
  const padding = parseFloat(getComputedStyle(grid).paddingTop) || 0;
  const offsets = children.map(child => Math.max(0, child.getBoundingClientRect().top - top - padding));
  grid.style.alignItems = 'start';
  children.forEach((child, index) => child.style.marginTop = offsets[index] + 'px');
  disclosures.forEach(details => details.open = true);
}
window.addEventListener('resize', anchorSetupForms);
function navWrap(name, fn){
  return function(...args){
    const r = fn.apply(this, args);
    const entry = {mm:true, screen:name, args:navArgs(name, args)};
    if(navPopping || curScreen === name){ entry.depth = navDepth; history.replaceState(entry, ""); }
    else if(curScreen === null){ entry.depth = navDepth = 0; history.replaceState(entry, ""); }
    else { entry.depth = ++navDepth; history.pushState(entry, ""); }
    curScreen = name;
    addBackButton();
    anchorSetupForms();
    return r;
  };
}
renderLanding = navWrap("landing", renderLanding);
renderSignIn = navWrap("signin", renderSignIn);
renderProviderSignup = navWrap("provsignup", renderProviderSignup);
renderAdminHome = navWrap("adminhome", renderAdminHome);
renderProviderHome = navWrap("provhome", renderProviderHome);
renderProviderProfileEdit = navWrap("provideredit", renderProviderProfileEdit);
renderRegister = navWrap("register", renderRegister);
renderSetup = navWrap("setup", renderSetup);
renderReview = navWrap("review", renderReview);
renderConfirmation = navWrap("confirmation", renderConfirmation);
renderPlan = navWrap("plan", renderPlan);
renderCheckEmail = navWrap("checkemail", renderCheckEmail);
renderForgot = navWrap("forgot", renderForgot);
renderNewPassword = navWrap("newpw", renderNewPassword);
const SCREENS = {adminhome:renderAdminHome, landing:renderLanding, signin:renderSignIn, provsignup:renderProviderSignup, provhome:renderProviderHome,
  provideredit:renderProviderProfileEdit, register:renderRegister, setup:renderSetup, review:renderReview, confirmation:renderConfirmation, plan:renderPlan, checkemail:renderCheckEmail, forgot:renderForgot};

// Screens that need someone signed in fall back to the home page after sign out.
function screenAllowed(name){
  if(name === "adminhome") return !!state.admin;
  if(name === "setup") return state.signedIn;
  if(name === "plan" || name === "review") return state.signedIn && !!state.move;
  if(name === "confirmation") return state.signedIn && Object.keys(state.bookings||{}).length > 0;
  if(name === "provhome" || name === "provideredit") return !!state.provider;
  return true;
}
function addBackButton(){
  // Main destinations have their own navigation; forms use a named destination.
  let label, destination;
  if(curScreen === "provideredit") { label = "Back to provider home"; destination = "provhome"; }
  else if(curScreen === "setup" && !state.move) { label = "Edit account details"; destination = "register"; }
  else if(curScreen === "review") { label = "Back to my plan"; destination = "plan"; }
  else if(["signin", "provsignup", "checkemail"].includes(curScreen)) { label = "Back to home"; destination = "landing"; }
  else if(curScreen === "forgot") { label = "Back to sign in"; destination = "signin"; }
  else return;
  const header = document.querySelector("#app .setup-top, #app .topbar .wrap");
  const mark = header && header.querySelector(".mark");
  if(!mark) return;
  const group = document.createElement("div");
  group.className = "nav-left";
  group.innerHTML = `<button type="button" class="back-btn" data-nav-destination="${destination}">${label}</button>`;
  mark.before(group);
  group.appendChild(mark);
}
document.addEventListener('click', e=>{const button=e.target.closest('[data-choose-task]');if(!button)return;const id=button.dataset.chooseTask;if(!id)return;state.open=id;renderPlan();const task=document.getElementById('t-'+id);if(task){task.scrollIntoView({behavior:'smooth',block:'center'});task.focus({preventScroll:true});}});
document.addEventListener("change", e=>{ if(e.target.matches('[data-show-password]')) document.querySelectorAll('#newpw input[autocomplete="new-password"]').forEach(input=>input.type=e.target.checked?'text':'password'); });
document.addEventListener("click", e=>{
  const button = e.target.closest("[data-nav-destination]");
  if(!button) return;
  const destination = button.dataset.navDestination;
  if(curScreen === "review") { syncDraft(); save(); }
  if(destination === "register") state.returnTo = null;
  const args = destination === "signin" ? (history.state?.args || []) : [];
  SCREENS[destination](...args);
  window.scrollTo(0,0);
});
window.addEventListener("popstate", e=>{
  const st = e.state;
  if(!st || !st.mm) return;                       // e.g. the landing page's "How it works" links
  if(st.screen === "landing" && curScreen === "landing") { navDepth = st.depth; return; }
  if(document.querySelector("[data-draft]") && typeof syncDraft === "function") syncDraft();
  const modal = document.getElementById("modal-root");
  if(modal && modal.innerHTML.trim() && typeof closeConfirm === "function") closeConfirm();
  navDepth = st.depth || 0;
  navPopping = true;
  try{
    if(screenAllowed(st.screen) && SCREENS[st.screen]) SCREENS[st.screen](...(st.args||[]));
    else renderLanding();
  } finally { navPopping = false; }
  window.scrollTo(0,0);
});

renderLanding();
if(sb){
  let handledRecovery = false;
  sb.auth.onAuthStateChange(evt=>{
    if(evt === "PASSWORD_RECOVERY" && !handledRecovery){ handledRecovery = true; setTimeout(()=>{ renderNewPassword(); window.scrollTo(0,0); }, 0); }
  });
  (async ()=>{
    try{
      const {data} = await sb.auth.getSession();
      const session = data && data.session;
      if(!session) return;
      if(OPENED_FROM_RESET){ if(!handledRecovery){ handledRecovery = true; renderNewPassword(); } return; }
      if(handledRecovery) return;
      await loadAccount(session.user.id);
      if(curScreen === "landing") renderLanding();   // buttons now say "Open my plan" or "My dashboard"
    }catch(e){}
  })();
}
</script>
